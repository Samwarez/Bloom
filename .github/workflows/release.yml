name: Build and release Bloom
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bloom-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check exact source inventory and secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -d -m 700 -o "$(id -u)" "/run/user/$(id -u)"
          python3 -B scripts/check-staged-content.py --gitleaks /tmp/gitleaks
      - name: Build and verify in Debian trixie
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/dist:/output" debian:trixie-slim sh /source/scripts/ci-build.sh
      - name: Publish verified development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import sys;sys.path.insert(0,"local/installer");from petal_installer import __version__;print(__version__)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; verified build completed without replacing published assets."
            exit 0
          fi
          cat > /tmp/bloom-release-notes.md <<'NOTES'
          Bloom portable Linux amd64 development release for testing PetalOS downloads and drive management.

          Download the portable `.tar.gz` and its `.sha256`, verify the checksum, extract the complete folder, then run `./bloom` as your normal desktop user. Debian 13 and compatible amd64 desktops; existing pkexec and desktop administrator authorization agent required. The `.deb` is an alternative.

          Includes Fast, Balanced and Paranoid Argon2id passphrase protection tiers. PetalOS is downloaded separately from Samwarez/PetalOS. See README and the app instructions for supported operations and test limits.

          This build passed source/GTK tests, package construction, complete portable integrity checks and relocation checks on a clean Debian builder. Hardware installation/update acceptance remains separate.
          NOTES
          gh release create "$tag" --target "$GITHUB_SHA" --title "Bloom $version — development release" --draft --notes-file /tmp/bloom-release-notes.md
          gh release upload "$tag" dist/*.deb dist/*.tar.gz dist/*.sha256
          gh release edit "$tag" --draft=false
